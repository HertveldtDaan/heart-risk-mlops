name: CI - tests

# Continuous Integration: every push / pull request is checked automatically.
# No Azure access needed: the tests train a tiny model on synthetic data.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
  workflow_call:   # reused by the MLOps pipeline as its first job

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit + API tests
        run: pytest -v

      - name: Validate Kubernetes manifests (client-side)
        run: |
          for f in k8s/*.yaml; do
            python -c "import sys, yaml; list(yaml.safe_load_all(open('$f'))); print('OK', '$f')"
          done
