$schema: https://azuremlschemas.azureedge.net/latest/amlCompute.schema.json
name: heart-cluster
type: amlcompute
size: STANDARD_DS2_V2   # 2 vCPU, 7 GB RAM: plenty for LightGBM on ~440k rows
min_instances: 0        # scale to zero when idle -> no costs when nothing runs
max_instances: 1
idle_time_before_scale_down: 120  # seconds
