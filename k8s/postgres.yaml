# PostgreSQL that stores every prediction of the API.
# StatefulSet + PersistentVolumeClaim: the data survives pod restarts and redeploys.
# The credentials come from the Secret `postgres-credentials`, created by the
# GitHub Actions deploy job from the repository secret POSTGRES_PASSWORD (never in git).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: heart-risk
  labels:
    app: postgres
spec:
  clusterIP: None          # headless: stable DNS name postgres-0.postgres for the StatefulSet
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: heart-risk
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi    # k3d provisions this with its built-in local-path storage class
