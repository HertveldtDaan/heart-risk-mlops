# Heart Risk API: 2 replicas behind a NodePort service, with probes, resource
# limits and a HorizontalPodAutoscaler. IMAGE_PLACEHOLDER is replaced by the
# workflow with the immutable image digest (ghcr.io/...@sha256:...).
apiVersion: v1
kind: ConfigMap
metadata:
  name: heart-api-config
  namespace: heart-risk
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  namespace: heart-risk
  labels:
    app: heart-api
spec:
  replicas: 2
  revisionHistoryLimit: 5          # keep old ReplicaSets for `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # zero downtime: a new pod must be ready before an old one stops
      maxSurge: 1
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: heart-api
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: heart-api-config
            - secretRef:
                name: postgres-credentials
          env:
            - name: IMAGE_REF
              value: IMAGE_PLACEHOLDER
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Liveness: restart the container when the process hangs
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          # Readiness: only send traffic when the model is loaded and the database is reachable
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-risk
spec:
  type: NodePort
  selector:
    app: heart-api
  ports:
    - port: 80
      targetPort: http
      nodePort: 30082
---
# Scale between 2 and 5 pods on CPU usage (needs metrics-server, included in k3d/k3s)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heart-api
  namespace: heart-risk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heart-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
